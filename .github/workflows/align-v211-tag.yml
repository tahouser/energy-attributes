name: Track EnergyIQ versions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  track-version:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable tag for manifest version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(gh api "/repos/${{ github.repository }}/contents/custom_components/energyiq/manifest.json?ref=${{ github.sha }}" --jq '.content' | base64 -d | jq -r '.version')
          TAG="v${VERSION}"

          # One-time repair of the accidentally moved v2.1.1 tag.
          # v2.1.1 is the last known good baseline before the v2.1.3 UI work.
          OLD_SHA="d430aad60acca925f8ced7c56b204036a22bede9"
          BASELINE_SHA="2738e92c060495b0a3686b36cc9f1ef9840f3b55"
          CURRENT_V211=$(gh api "/repos/${{ github.repository }}/git/ref/tags/v2.1.1" --jq '.object.sha' 2>/dev/null || true)
          if [ "$CURRENT_V211" = "$OLD_SHA" ]; then
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${{ github.repository }}/git/refs/tags/v2.1.1" \
              -f sha="$BASELINE_SHA" \
              -F force=true
          fi

          # Version tags are immutable: a tag is created only when that version
          # does not already exist. Future changes require a manifest version bump.
          if ! gh api "/repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
          else
            echo "$TAG already exists; leaving it unchanged. Bump manifest.json for a new release."
          fi
