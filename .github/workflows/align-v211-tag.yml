name: Track EnergyIQ versions

on:
  push:
    branches:
      - main

concurrency:
  group: energyiq-version-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create immutable version tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only a commit that actually changes manifest.json is a release
          # commit. This prevents intermediate frontend/code commits from
          # consuming the new version before the final manifest commit lands.
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- custom_components/energyiq/manifest.json; then
              echo "manifest.json did not change in this commit; no release needed."
              exit 0
            fi
          fi

          VERSION=$(jq -r '.version' custom_components/energyiq/manifest.json)
          TAG="v${VERSION}"

          # Release tags are immutable. Never move or rewrite an existing tag.
          if ! gh api "/repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
            echo "Created $TAG at ${{ github.sha }}"
          else
            echo "$TAG already exists; leaving it unchanged."
          fi

          # HACS uses GitHub releases for the normal update/download path.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "EnergyIQ $TAG" \
              --generate-notes
            echo "Created release $TAG"
          else
            echo "Release $TAG already exists; leaving it unchanged."
          fi
