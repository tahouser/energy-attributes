name: Track EnergyIQ versions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  track-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create immutable version tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' custom_components/energyiq/manifest.json)
          TAG="v${VERSION}"

          # Release tags are immutable. Never move or rewrite an existing tag.
          if ! gh api "/repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
            echo "Created $TAG at ${{ github.sha }}"
          else
            echo "$TAG already exists; leaving it unchanged."
          fi

          # HACS uses GitHub releases for the normal update/download path.
          # Create the release when the version tag does not already have one.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "EnergyIQ $TAG" \
              --generate-notes
            echo "Created release $TAG"
          else
            echo "Release $TAG already exists; leaving it unchanged."
          fi
