name: Track EnergyIQ versions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  track-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create immutable version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' custom_components/energyiq/manifest.json)
          TAG="v${VERSION}"

          # v2.1.1 is the stable baseline and must never move again.
          BASELINE_SHA="2738e92c060495b0a3686b36cc9f1ef9840f3b55"
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/git/refs/tags/v2.1.1" \
            -f sha="$BASELINE_SHA" \
            -F force=true

          # A version tag is created only once. Changing code without changing
          # manifest.json never moves an existing release tag.
          if [ "$TAG" != "v2.1.1" ] && ! gh api "/repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
            echo "Created $TAG at ${{ github.sha }}"
          else
            echo "$TAG already exists; leaving it unchanged. Bump manifest.json for a new release."
          fi
