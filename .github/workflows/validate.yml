name: Validate EnergyIQ

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/energyiq tests

      - name: Validate frontend JavaScript syntax
        run: node --check custom_components/energyiq/www/energyiq-panel.js

      - name: Validate release structure and panel identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/energyiq/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          init = Path('custom_components/energyiq/__init__.py').read_text(encoding='utf-8')
          js = Path('custom_components/energyiq/www/energyiq-panel.js').read_text(encoding='utf-8')

          expected_frontend_version = version.replace('.', '') + '0'
          stable_panel_id = 'energyiq-panel-v309'

          assert f'sidebar_title="EnergyIQ • v{version}"' in init
          assert f'FRONTEND_VERSION = "{expected_frontend_version}"' in init
          assert f'webcomponent_name="{stable_panel_id}"' in init
          assert 'URL_BASE = "/energyiq-static"' in init
          assert 'module_url=f"{URL_BASE}/energyiq-panel.js?v={FRONTEND_VERSION}"' in init
          assert f'const TAG = "{stable_panel_id}";' in js

          assert Path('custom_components/energyiq/www/energyiq-panel.js').is_file()
          assert not Path('custom_components/energyiq/www/energyiq-panel-entry.js').exists()
          assert not Path('custom_components/energyiq/www/energyiq-ui.js').exists()

          www = Path('custom_components/energyiq/www')
          assert not list(www.glob('energyiq-panel-v*.js')), 'Versioned runtime panel copies are not allowed.'
          assert not list(www.glob('README*.txt')), 'Temporary frontend README files are not allowed.'
          assert not list(www.glob('*.tmp')), 'Temporary frontend files are not allowed.'
          assert not list(www.glob('*.bak')), 'Temporary frontend backups are not allowed.'

          print(f'EnergyIQ {version} structure and stable panel identity validated.')
          PY
