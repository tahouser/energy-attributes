name: Validate EnergyIQ

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/energyiq tests

      - name: Validate frontend JavaScript syntax
        run: |
          node --check custom_components/energyiq/www/energyiq-panel.js
          node --check custom_components/energyiq/www/energyiq-loader-v314.js

      - name: Validate release structure and panel loading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('custom_components/energyiq/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          init = Path('custom_components/energyiq/__init__.py').read_text(encoding='utf-8')
          js = Path('custom_components/energyiq/www/energyiq-panel.js').read_text(encoding='utf-8')

          expected_frontend_version = version.replace('.', '') + '0'
          panel_match = re.search(r'webcomponent_name="([^"]+)"', init)
          module_match = re.search(r'module_url=f"\{URL_BASE\}/([^"?]+)\?v=\{FRONTEND_VERSION\}"', init)
          assert panel_match, 'Panel webcomponent_name is missing.'
          assert module_match, 'Panel module_url is missing.'

          panel_id = panel_match.group(1)
          loader_name = module_match.group(1)
          loader = Path('custom_components/energyiq/www') / loader_name

          assert f'sidebar_title="EnergyIQ • v{version}"' in init
          assert f'FRONTEND_VERSION = "{expected_frontend_version}"' in init
          assert 'URL_BASE = "/energyiq-static"' in init
          assert loader.is_file(), f'Registered frontend loader does not exist: {loader_name}'
          assert f'customElements.define("{panel_id}"' in loader.read_text(encoding='utf-8')
          assert 'energyiq-panel.js' in loader.read_text(encoding='utf-8')
          assert 'const TAG = "energyiq-panel-v309";' in js

          assert Path('custom_components/energyiq/www/energyiq-panel.js').is_file()
          assert not Path('custom_components/energyiq/www/energyiq-panel-entry.js').exists()
          assert not Path('custom_components/energyiq/www/energyiq-ui.js').exists()
          assert not list(Path('custom_components/energyiq/www').glob('README*.txt'))
          assert not list(Path('custom_components/energyiq/www').glob('*.tmp'))
          assert not list(Path('custom_components/energyiq/www').glob('*.bak'))

          print(f'EnergyIQ {version} structure and isolated frontend loader validated.')
          PY
