name: Validate EnergyIQ

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/energyiq tests

      - name: Validate persistence contract
        run: python tests/test_persistence_standalone.py

      - name: Validate frontend JavaScript syntax
        run: |
          node --check custom_components/energyiq/www/energyiq-panel.js
          node --check custom_components/energyiq/www/energyiq-meter-detector.js
          CARD_FILE="$(python - <<'PY'
          import re
          from pathlib import Path
          init = Path('custom_components/energyiq/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'CARD_PATH = f"\\{URL_BASE\\}/([^"]+)"', init)
          if not match:
              raise SystemExit('CARD_PATH is missing or cannot be resolved.')
          print(Path('custom_components/energyiq/www') / match.group(1))
          PY
          )"
          test -f "$CARD_FILE" || { echo "::error::Registered card file is missing: $CARD_FILE"; exit 1; }
          node --check "$CARD_FILE"

      - name: Validate release structure and panel loading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('custom_components/energyiq/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          init = Path('custom_components/energyiq/__init__.py').read_text(encoding='utf-8')
          js = Path('custom_components/energyiq/www/energyiq-panel.js').read_text(encoding='utf-8')

          panel_match = re.search(r'webcomponent_name="([^"]+)"', init)
          module_match = re.search(r'module_url=f"\{URL_BASE\}/([^"?]+)\?v=\{FRONTEND_VERSION\}"', init)
          assert panel_match, 'Panel webcomponent_name is missing.'
          assert module_match, 'Panel module_url is missing.'

          panel_id = panel_match.group(1)
          module_name = module_match.group(1)
          module = Path('custom_components/energyiq/www') / module_name
          assert module.is_file(), f'Registered frontend module does not exist: {module_name}'
          assert module_name == 'energyiq-panel.js', 'EnergyIQ must load the panel directly; no legacy loader layer is permitted.'

          assert 'INTEGRATION_VERSION = json.loads(_MANIFEST_PATH.read_text(encoding="utf-8"))["version"]' in init
          assert 'sidebar_title=f"EnergyIQ • v{INTEGRATION_VERSION}"' in init
          frontend_match = re.search(r'FRONTEND_VERSION = "([0-9]+)"', init)
          assert frontend_match, 'FRONTEND_VERSION is missing.'
          assert 'URL_BASE = "/energyiq-static"' in init
          card_match = re.search(r'CARD_PATH = f"\\{URL_BASE\\}/([^"]+)"', init)
          assert card_match, 'Registered card path is missing.'
          card_file = Path('custom_components/energyiq/www') / card_match.group(1)
          assert card_file.is_file(), f'Registered card file does not exist: {card_file}'
          assert 'CARD_URL = f"{CARD_PATH}?v={FRONTEND_VERSION}"' in init
          assert f'const TAG = "{panel_id}";' in js
          assert 'customElements.define(TAG' in js

          assert Path('custom_components/energyiq/www/energyiq-panel.js').is_file()
          assert not list(Path('custom_components/energyiq/www').glob('energyiq-loader-*.js'))
          assert not Path('custom_components/energyiq/www/energyiq-panel-entry.js').exists()
          assert not Path('custom_components/energyiq/www/energyiq-ui.js').exists()
          assert not list(Path('custom_components/energyiq/www').glob('README*.txt'))
          assert not list(Path('custom_components/energyiq/www').glob('*.tmp'))
          assert not list(Path('custom_components/energyiq/www').glob('*.bak'))

          coordinator = Path('custom_components/energyiq/coordinator.py').read_text(encoding='utf-8')
          assert 'def _fast_power_entity(self)' in coordinator
          assert 'Never use a switch/control entity as a power measurement.' in coordinator
          assert 'EM1.GetStatus(sum)' in coordinator
          assert 'EM.GetStatus' in coordinator

          print(f'EnergyIQ {version} structure, direct frontend loading, and fast power measurement validated.')
          PY
