name: Validate EnergyIQ

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/energyiq tests
      - name: Validate frontend JavaScript syntax
        run: |
          node --check custom_components/energyiq/www/energyiq-panel.js
          node --check custom_components/energyiq/www/energyiq-training-panel.js
      - name: Validate release structure and training
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          manifest = json.loads(Path('custom_components/energyiq/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          init = Path('custom_components/energyiq/__init__.py').read_text(encoding='utf-8')
          expected_frontend_version = version.replace('.', '') + '0'
          panel_match = re.search(r'webcomponent_name="([^"]+)"', init)
          module_match = re.search(r'module_url=f"\{URL_BASE\}/([^"?]+)\?v=\{FRONTEND_VERSION\}"', init)
          assert panel_match and module_match
          panel_id = panel_match.group(1)
          module_name = module_match.group(1)
          module = Path('custom_components/energyiq/www') / module_name
          assert module.is_file(), module_name
          assert module_name == 'energyiq-training-panel.js'
          js = module.read_text(encoding='utf-8')
          assert 'energyiq-panel.js?v=31360' in js
          assert 'customElements.define(TAG' in js
          assert 'class EnergyIQTrainingPanel extends Base' in js
          assert 'Automatic — 5 fresh readings' in js
          assert 'Manual — guided 5-reading capture' in js
          assert '5-second minimum' in js
          assert f'sidebar_title="EnergyIQ • v{version}"' in init
          assert f'FRONTEND_VERSION = "{expected_frontend_version}"' in init
          assert 'URL_BASE = "/energyiq-static"' in init
          assert panel_id == 'energyiq-panel-training-v138'
          training = Path('custom_components/energyiq/training.py').read_text(encoding='utf-8')
          assert 'target_readings: int = 5' in training
          assert 'manual_min_active_s: float = 5.0' in training
          assert 'self.learned_source_w = fifth.watts' in training
          assert 'self.learned_w = max(0.0, fifth.watts - baseline)' in training
          print(f'EnergyIQ {version} five-reading training validated.')
          PY
