name: Apply quick UI fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-quick-ui-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = p.read_text()
          s = s.replace('const TAG = "energyiq-panel-v305";', 'const TAG = "energyiq-panel-v306";', 1)
          s = s.replace('const VERSION = "3.0.5";', 'const VERSION = "3.0.6";', 1)
          s = s.replace('const previousScroll = this.scrollTop;\n        this.workspace', 'const scrollerBeforeRender = this.querySelector(".table-scroll");\n        const previousScroll = scrollerBeforeRender ? scrollerBeforeRender.scrollTop : this.scrollTop;\n        this.workspace', 1)
          s = s.replace('<input class="train" type="checkbox" data-train="${this.attr(device.device_id)}" ${trainChecked ? "checked" : ""} ${monitored ? "" : "disabled"}>', '<input class="train" type="checkbox" data-train="${this.attr(device.device_id)}" ${trainChecked ? "checked" : ""} ${monitored ? "" : "disabled"}>', 1)
          marker = '    styles() {'
          css = '''    styles() {\n      return `\n        :host { display:block; }\n        .table-scroll input[type="checkbox"] { width:18px; height:18px; margin:0; }\n      ` + '''
          # Do not replace the existing styles function; inject a rule into its returned CSS instead.
          needle = '      return `'
          if needle not in s:
              raise SystemExit('styles return marker not found')
          s = s.replace(needle, needle + '\\n        .table-scroll input.train, .table-scroll input.monitor { width:18px; height:18px; margin:0; }', 1)
          p.write_text(s)

          p = Path('custom_components/energyiq/__init__.py')
          s = p.read_text()
          s = s.replace('FRONTEND_VERSION = "3050"', 'FRONTEND_VERSION = "3060"', 1)
          s = s.replace('webcomponent_name="energyiq-panel-v305"', 'webcomponent_name="energyiq-panel-v306"', 1)
          s = s.replace('sidebar_title="EnergyIQ • v3.0.5"', 'sidebar_title="EnergyIQ • v3.0.6"', 1)
          p.write_text(s)

          p = Path('custom_components/energyiq/manifest.json')
          s = p.read_text().replace('"version": "3.0.5"', '"version": "3.0.6"', 1)
          p.write_text(s)
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js
          python -m compileall -q custom_components/energyiq tests
          rm .github/workflows/apply-quick-ui-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --check
          git commit -m 'Fix table checkbox sizing and scroll position'
          git push origin HEAD:main
