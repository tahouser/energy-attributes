name: Build EnergyIQ 3.1.54

on:
  push:
    branches:
      - energyiq-3.1.54

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energyiq-3.1.54
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_3_1_54.py
      - name: Commit generated revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py custom_components/energyiq/config_flow.py custom_components/energyiq/www/energyiq-panel.js
          git diff --cached --quiet || git commit -m 'EnergyIQ 3.1.54: UI, Browser Mod filter, and sidebar icon'
          git push origin energyiq-3.1.54
