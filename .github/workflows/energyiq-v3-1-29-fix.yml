name: Prepare EnergyIQ v3.1.29
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Full Cycle backend, training, and scroll handling
        run: |
          python - <<'PY'
          from pathlib import Path
          
          p = Path('custom_components/energyiq/websocket.py')
          s = p.read_text()
          s = s.replace('import json\nfrom pathlib import Path', 'import asyncio\nimport json\nfrom pathlib import Path', 1)
          marker = '''@websocket_api.websocket_command({\n    vol.Required("type"): "energy_attribution/retry_training",'''
          handlers = '''@websocket_api.websocket_command({\n    vol.Required("type"): "energy_attribution/confirm_long_cycle",\n    vol.Required("entry_id"): str,\n    vol.Required("device_id"): str,\n    vol.Required("accepted"): bool,\n})\n@websocket_api.require_admin\n@websocket_api.async_response\nasync def ws_confirm_long_cycle(hass, connection, msg):\n    coordinator = _coordinator(hass, msg["entry_id"])\n    device_id = msg["device_id"]\n    if coordinator._training_device != device_id or coordinator._training_engine is None:\n        raise ValueError("No active training session exists for this device")\n    engine = coordinator._training_engine\n    if engine.method != "full_cycle":\n        raise ValueError("This control is only available for Full Cycle training")\n    now = hass.loop.time()\n    result = engine.confirm_full_cycle(msg["accepted"], now)\n    state = coordinator.training_state.get(device_id, {})\n    state.update({k: result.get(k) for k in ("phase", "baseline_w", "peak_delta_w", "duration_s", "energy_wh")})\n    state["result"] = result\n    if result.get("failed"):\n        state["status"] = "error"\n        state["error"] = result.get("failure_reason")\n        state["instruction"] = result.get("failure_reason")\n    elif result.get("phase") == "capturing":\n        state["instruction"] = "Capturing power. Leave the device ON, then press Stop & Save when the cycle is complete."\n    else:\n        state["instruction"] = "Waiting for the target load to be ON. Press Start Power Capture when ready."\n    await coordinator._persist(force=True)\n    connection.send_result(msg["id"], result)\n\n\n@websocket_api.websocket_command({\n    vol.Required("type"): "energy_attribution/end_long_cycle",\n    vol.Required("entry_id"): str,\n    vol.Required("device_id"): str,\n    vol.Optional("force", default=False): bool,\n})\n@websocket_api.require_admin\n@websocket_api.async_response\nasync def ws_end_long_cycle(hass, connection, msg):\n    coordinator = _coordinator(hass, msg["entry_id"])\n    device_id = msg["device_id"]\n    if coordinator._training_device != device_id or coordinator._training_engine is None:\n        raise ValueError("No active training session exists for this device")\n    engine = coordinator._training_engine\n    if engine.method != "full_cycle":\n        raise ValueError("This control is only available for Full Cycle training")\n    now = hass.loop.time()\n    result = engine.end_full_cycle(force=msg["force"])\n    state = coordinator.training_state.get(device_id, {})\n    state.update({k: result.get(k) for k in ("phase", "baseline_w", "peak_delta_w", "duration_s", "energy_wh")})\n    state["result"] = result\n    if result.get("action") == "end_warning":\n        state["instruction"] = "Not ready to save: keep the device ON for at least 30 seconds before pressing Stop & Save."\n    elif result.get("completed"):\n        state["status"] = "complete"\n        state["learned"] = True\n        state["completed"] = True\n        state["completed_at"] = now\n        state["learned_signature"] = {\n            "method": "full_cycle",\n            "baseline_w": result.get("baseline_w"),\n            "load_w": result.get("peak_delta_w"),\n            "duration_s": result.get("duration_s"),\n            "energy_wh": result.get("energy_wh"),\n            "events_detected": result.get("events_detected", 0),\n            "observations": result.get("observations", []),\n        }\n        coordinator.last_training_device_id = device_id\n        if coordinator._direct_rpc_task and not coordinator._direct_rpc_task.done():\n            coordinator._direct_rpc_task.cancel()\n    await coordinator._persist(force=True)\n    connection.send_result(msg["id"], result)\n\n\n''' 
          if marker not in s:
              raise SystemExit('websocket insertion marker not found')
          s = s.replace(marker, handlers + marker, 1)
          old = 'for handler in (ws_list_entries, ws_workspace, ws_set_monitoring, ws_add_manual_device, ws_list_available_entities, ws_add_entity, ws_start_training, ws_bulk_auto_training, ws_bulk_training_state, ws_retry_training, ws_stop_training):'
          new = 'for handler in (ws_list_entries, ws_workspace, ws_set_monitoring, ws_add_manual_device, ws_list_available_entities, ws_add_entity, ws_start_training, ws_bulk_auto_training, ws_bulk_training_state, ws_confirm_long_cycle, ws_end_long_cycle, ws_retry_training, ws_stop_training):'
          if old not in s:
              raise SystemExit('websocket registration marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          
          p = Path('custom_components/energyiq/training.py')
          s = p.read_text()
          s = s.replace('    full_cycle_min_active_s: float = 30.0\n', '    full_cycle_min_active_s: float = 30.0\n    full_cycle_settle_s: float = 5.0\n', 1)
          s = s.replace('    _end_requested: bool = False\n', '    _end_requested: bool = False\n    _full_active_samples: list[PowerSample] = field(default_factory=list)\n', 1)
          old = '''    def _full_step(self, s: PowerSample) -> dict:\n        # Long Cycle is deliberately supervised: detect the first event, then\n        # require the user to identify it before treating it as the target load.\n        if self.phase == "waiting_for_start" and s.watts >= self.baseline_w + self.on_threshold_w:\n            self.phase = "awaiting_confirmation"\n            self.cycle_started = s.timestamp\n            self.active_started = s.timestamp\n            self.active_peak_w = s.watts\n            return self.result(action="confirm_start")\n        if self.phase == "capturing":\n            self.active_peak_w = max(self.active_peak_w or s.watts, s.watts)\n        return self.result()\n'''
          new = '''    def _full_step(self, s: PowerSample) -> dict:\n        # Full Cycle is supervised. Once the user starts capture, measure the\n        # sustained load rather than using a single maximum sample.\n        if self.phase == "waiting_for_start" and s.watts >= (self.baseline_w or s.watts) + self.on_threshold_w:\n            self.phase = "awaiting_confirmation"\n            self.cycle_started = s.timestamp\n            self.active_started = s.timestamp\n            self.active_peak_w = s.watts\n            self._full_active_samples = [s]\n            return self.result(action="confirm_start")\n        if self.phase == "capturing":\n            self._full_active_samples.append(s)\n            self.active_peak_w = max(self.active_peak_w or s.watts, s.watts)\n        return self.result()\n'''
          if old not in s:
              raise SystemExit('training full-step block not found')
          s = s.replace(old, new, 1)
          old = '''            if self.active_peak_w is None:\n                self.active_peak_w = self.samples[-1].watts if self.samples else (self.baseline_w or 0.0)\n            return self.result()\n'''
          new = '''            if self.active_peak_w is None:\n                self.active_peak_w = self.samples[-1].watts if self.samples else (self.baseline_w or 0.0)\n            if self.samples:\n                self._full_active_samples = [self.samples[-1]]\n            return self.result()\n'''
          if old not in s:
              raise SystemExit('training confirm block not found')
          s = s.replace(old, new, 1)
          old = '''    def end_full_cycle(self, force: bool = False) -> dict:\n        if self.method != "full_cycle" or self.phase != "capturing":\n            return self.result(failed=True, failure_reason="Long-cycle training is not currently capturing a confirmed load.")\n        self._end_requested = True\n        baseline = self.baseline_w if self.baseline_w is not None else 0.0\n        duration = max(0.0, self.samples[-1].timestamp - (self.cycle_started or self.samples[-1].timestamp)) if self.samples else 0.0\n        recent_samples = [x for x in self.samples if self.samples and x.timestamp >= self.samples[-1].timestamp - self.idle_window_s]\n        returned = bool(recent_samples) and max(abs(x.watts - baseline) for x in recent_samples) <= self.return_tolerance_w\n        if not force and (not returned or duration < self.full_cycle_min_active_s):\n            self._end_requested = False\n            return self.result(action="end_warning", end_ready=returned and duration >= self.full_cycle_min_active_s, end_returned=returned, end_duration_s=duration)\n        self.completed = True; self.phase = "complete"\n        return self.result()\n'''
          new = '''    def end_full_cycle(self, force: bool = False) -> dict:\n        if self.method != "full_cycle" or self.phase != "capturing":\n            return self.result(failed=True, failure_reason="Long-cycle training is not currently capturing a confirmed load.")\n        self._end_requested = True\n        baseline = self.baseline_w if self.baseline_w is not None else 0.0\n        duration = max(0.0, self.samples[-1].timestamp - (self.cycle_started or self.samples[-1].timestamp)) if self.samples else 0.0\n        active = self._full_active_samples or self.samples\n        settled = [x.watts for x in active if self.cycle_started is not None and x.timestamp >= self.cycle_started + self.full_cycle_settle_s]\n        if not settled:\n            settled = [x.watts for x in active]\n        stable_load = median(settled) - baseline if settled else 0.0\n        self.active_peak_w = baseline + max(0.0, stable_load)\n        if not force and duration < self.full_cycle_min_active_s:\n            self._end_requested = False\n            return self.result(action="end_warning", end_ready=False, end_returned=False, end_duration_s=duration)\n        self.completed = True\n        self.phase = "complete"\n        return self.result()\n'''
          if old not in s:
              raise SystemExit('training end block not found')
          s = s.replace(old, new, 1)
          old = '''        peak_delta = None; duration = None\n        if self.method == "quick" and self.observations: peak_delta = median(o.delta_w for o in self.observations)\n        elif self.baseline_w is not None: peak_delta = max(0.0, max((s.watts for s in self.samples), default=self.baseline_w)-self.baseline_w)\n'''
          new = '''        peak_delta = None; duration = None\n        if self.method == "quick" and self.observations:\n            peak_delta = median(o.delta_w for o in self.observations)\n        elif self.baseline_w is not None and self.method == "full_cycle" and self.phase in {"capturing", "complete"}:\n            active = self._full_active_samples or self.samples\n            values = [x.watts for x in active if self.cycle_started is None or x.timestamp >= self.cycle_started + self.full_cycle_settle_s]\n            if not values:\n                values = [x.watts for x in active]\n            peak_delta = max(0.0, median(values) - self.baseline_w) if values else 0.0\n        elif self.baseline_w is not None:\n            peak_delta = max(0.0, max((s.watts for s in self.samples), default=self.baseline_w)-self.baseline_w)\n'''
          if old not in s:
              raise SystemExit('training result block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          
          p = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = p.read_text()
          old = '''    async startTraining(deviceId, method) { const device = this.getDevices().find(d => d.device_id === deviceId); if (!device) return; const message = method === "quick" ? `EnergyIQ will automatically turn “${device.name}” ON and OFF during Quick Training. Continue?` : method === "manual" ? `Manual training for “${device.name}”. No command will be sent to the device. Continue?` : `Run a Full Cycle training session for “${device.name}”?`; if (!window.confirm(message)) return; try { await this.ws({ type: "energy_attribution/start_training", entry_id: this.entryId, device_id: deviceId, method }); await this.refresh(true); } catch (error) { this.showToast(error?.message || "Unable to start training", true); } }\n    async stopTraining(deviceId) { try { await this.ws({ type: "energy_attribution/stop_training", entry_id: this.entryId, device_id: deviceId }); await this.refresh(true); } catch (error) { this.showToast(error?.message || "Unable to stop training", true); } }\n'''
          new = '''    async _refreshPreserveTableScroll() {\n      const scroller = this.querySelector(".table-scroll");\n      const top = scroller ? scroller.scrollTop : 0;\n      await this.refresh(true);\n      requestAnimationFrame(() => {\n        const next = this.querySelector(".table-scroll");\n        if (next) next.scrollTop = top;\n      });\n    }\n    async startTraining(deviceId, method) { const device = this.getDevices().find(d => d.device_id === deviceId); if (!device) return; const message = method === "quick" ? `EnergyIQ will automatically turn “${device.name}” ON and OFF during Quick Training. Continue?` : method === "manual" ? `Manual training for “${device.name}”. No command will be sent to the device. Continue?` : `Run a Full Cycle training session for “${device.name}”?`; if (!window.confirm(message)) return; try { await this.ws({ type: "energy_attribution/start_training", entry_id: this.entryId, device_id: deviceId, method }); await this._refreshPreserveTableScroll(); } catch (error) { this.showToast(error?.message || "Unable to start training", true); } }\n    async stopTraining(deviceId) { try { await this.ws({ type: "energy_attribution/stop_training", entry_id: this.entryId, device_id: deviceId }); await this._refreshPreserveTableScroll(); } catch (error) { this.showToast(error?.message || "Unable to stop training", true); } }\n'''
          if old not in s:
              raise SystemExit('frontend training methods block not found')
          s = s.replace(old, new, 1)
          s = s.replace('        await this.refresh(true);\n      } catch (error) {\n        this.showToast(error?.message || "Unable to control Full Cycle capture", true);', '        await this._refreshPreserveTableScroll();\n      } catch (error) {\n        this.showToast(error?.message || "Unable to control Full Cycle capture", true);', 1)
          p.write_text(s)
          
          p = Path('custom_components/energyiq/manifest.json')
          s = p.read_text().replace('"version": "3.1.28"', '"version": "3.1.29"', 1)
          p.write_text(s)
          
          p = Path('custom_components/energyiq/__init__.py')
          s = p.read_text().replace('FRONTEND_VERSION = "31280"', 'FRONTEND_VERSION = "31290"', 1).replace('EnergyIQ • v3.1.28', 'EnergyIQ • v3.1.29', 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m compileall -q custom_components/energyiq tests
          node --check custom_components/energyiq/www/energyiq-panel.js
          python - <<'PY'
          import json
          m=json.load(open('custom_components/energyiq/manifest.json'))
          assert m['version']=='3.1.29'
          print('EnergyIQ v3.1.29 validation passed')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py custom_components/energyiq/websocket.py custom_components/energyiq/training.py custom_components/energyiq/www/energyiq-panel.js
          git commit -m 'Fix Full Cycle training and preserve table scroll'
          git add .github/workflows/energyiq-v3-1-29-fix.yml
          git commit -m 'Remove temporary v3.1.29 patch workflow'
          git push
