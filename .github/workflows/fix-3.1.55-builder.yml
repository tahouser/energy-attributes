name: Fix 3.1.55 builder
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Start EnergyIQ 3.1.55 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Correct baseline SHA
        run: |
          sed -i 's/cef34f051a540700c96f0427d9fcd953290ba0a/cef34f051a540700c96f0427d9fcd953290ba66c/' .github/workflows/build-3.1.55.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-3.1.55.yml
          git commit -m 'Start EnergyIQ 3.1.55 build'
          git push origin HEAD:main
