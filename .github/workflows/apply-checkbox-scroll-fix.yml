name: Apply EnergyIQ checkbox scroll fix

on:
  push:
    paths:
      - .github/workflows/apply-checkbox-scroll-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js_path = Path('custom_components/energyiq/www/energyiq-panel.js')
          text = js_path.read_text(encoding='utf-8')
          old = '''      this.querySelectorAll("[data-monitor]").forEach(box => box.addEventListener("change", event => {\n        const selected = this.getSelectedIds();\n        const id = event.currentTarget.dataset.monitor;\n        if (event.currentTarget.checked) selected.add(id); else selected.delete(id);\n        this.pending = selected;\n        this.render();\n      }));'''
          new = '''      this.querySelectorAll("[data-monitor]").forEach(box => box.addEventListener("change", event => {\n        const scroller = this.querySelector(".table-scroll");\n        const scrollTop = scroller ? scroller.scrollTop : 0;\n        const scrollLeft = scroller ? scroller.scrollLeft : 0;\n        const selected = this.getSelectedIds();\n        const id = event.currentTarget.dataset.monitor;\n        if (event.currentTarget.checked) selected.add(id); else selected.delete(id);\n        this.pending = selected;\n        this.render();\n        requestAnimationFrame(() => {\n          const nextScroller = this.querySelector(".table-scroll");\n          if (nextScroller) {\n            nextScroller.scrollTop = scrollTop;\n            nextScroller.scrollLeft = scrollLeft;\n          }\n        });\n      }));'''
          if old not in text:
              raise SystemExit('Expected monitor checkbox handler was not found; refusing to modify the file.')
          text = text.replace(old, new, 1)
          text = text.replace('const TAG = "energyiq-panel-v308";', 'const TAG = "energyiq-panel-v309";', 1)
          text = text.replace('const VERSION = "3.0.8";', 'const VERSION = "3.0.9";', 1)
          js_path.write_text(text, encoding='utf-8')

          manifest_path = Path('custom_components/energyiq/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '3.0.9'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          init_path = Path('custom_components/energyiq/__init__.py')
          init = init_path.read_text(encoding='utf-8')
          init = init.replace('FRONTEND_VERSION = "3080"', 'FRONTEND_VERSION = "3090"', 1)
          init = init.replace('webcomponent_name="energyiq-panel-v308"', 'webcomponent_name="energyiq-panel-v309"', 1)
          init = init.replace('sidebar_title="EnergyIQ • v3.0.8"', 'sidebar_title="EnergyIQ • v3.0.9"', 1)
          init_path.write_text(init, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m compileall -q custom_components/energyiq tests
          node --check custom_components/energyiq/www/energyiq-panel.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py
          git commit -m "Preserve table scroll when changing monitor selection"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-checkbox-scroll-fix.yml
          git add .github/workflows/apply-checkbox-scroll-fix.yml
          git commit -m "Remove temporary checkbox scroll workflow"
          git push

      - name: Create release
        uses: actions/github-script@v7
        env:
          VERSION: 3.0.9
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(err => err.status === 404 ? null : Promise.reject(err));
            if (existing) {
              core.info(`Release ${tag} already exists.`);
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.ref.replace('refs/heads/', '')
            });
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: branch.data.commit.sha,
              name: `EnergyIQ ${tag}`,
              body: `EnergyIQ ${tag}\n\nPreserve table scroll position when changing Monitor selections.`,
              draft: false,
              prerelease: false
            });