name: Fix Full Cycle start behavior
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix supervised Full Cycle start path
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('custom_components/energyiq/training.py')
          s = p.read_text()
          old = '''    def confirm_full_cycle(self, accepted: bool, timestamp: float) -> dict:\n        if self.method != "full_cycle" or self.phase != "awaiting_confirmation":\n            return self.result(failed=True, failure_reason="Long-cycle training is not waiting for event confirmation.")\n        if accepted:\n            self.phase = "capturing"\n            self._end_requested = False\n            if self.cycle_started is None: self.cycle_started = timestamp\n            self.active_started = self.cycle_started\n            return self.result()\n'''
          new = '''    def confirm_full_cycle(self, accepted: bool, timestamp: float) -> dict:\n        if self.method != "full_cycle" or self.phase not in {"awaiting_confirmation", "waiting_for_start"}:\n            return self.result(failed=True, failure_reason="Long-cycle training is not waiting to start or confirm an event.")\n        if accepted:\n            self.phase = "capturing"\n            self._end_requested = False\n            if self.cycle_started is None: self.cycle_started = timestamp\n            self.active_started = self.cycle_started\n            if self.active_peak_w is None:\n                self.active_peak_w = self.samples[-1].watts if self.samples else (self.baseline_w or 0.0)\n            return self.result()\n'''
          if old not in s:
              raise SystemExit('training.py target block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = p.read_text()
          old = '''    async fullCycleAction(deviceId, action) { try { await this.ws({ type: "energy_attribution/full_cycle_action", entry_id: this.entryId, device_id: deviceId, action }); await this.refresh(true); } catch (error) { this.showToast(error?.message || "Unable to control Full Cycle capture", true); } }'''
          new = '''    async fullCycleAction(deviceId, action) {\n      try {\n        if (action === "start_capture") {\n          await this.ws({ type: "energy_attribution/confirm_long_cycle", entry_id: this.entryId, device_id: deviceId, accepted: true });\n        } else if (action === "stop_capture") {\n          await this.ws({ type: "energy_attribution/end_long_cycle", entry_id: this.entryId, device_id: deviceId, force: false });\n        }\n        await this.refresh(true);\n      } catch (error) { this.showToast(error?.message || "Unable to control Full Cycle capture", true); }\n    }'''
          if old not in s:
              raise SystemExit('frontend target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/training.py custom_components/energyiq/www/energyiq-panel.js .github/workflows/fix-full-cycle-start.yml
          git commit -m 'Fix Full Cycle manual start and end controls'
          git rm .github/workflows/fix-full-cycle-start.yml
          git commit -m 'Remove temporary Full Cycle fix workflow'
          git push
