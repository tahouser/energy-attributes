name: Release EnergyIQ version

on:
  push:
    branches:
      - main
    paths:
      - custom_components/energyiq/manifest.json
      - .github/workflows/release-on-version-change.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open('custom_components/energyiq/manifest.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(err => err.status === 404 ? null : Promise.reject(err));
            if (existing) {
              core.info(`Release ${tag} already exists.`);
              return;
            }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `EnergyIQ ${tag}`,
              body: `EnergyIQ ${tag}\n\nAutomated release.`,
              draft: false,
              prerelease: false
            });
