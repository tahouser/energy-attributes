name: Release after successful validation

on:
  workflow_run:
    workflows: ["Validate EnergyIQ"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version from validated commit
        id: version
        shell: bash
        run: echo "version=$(python -c 'import json; print(json.load(open("custom_components/energyiq/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Verify or create release for the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
          else
            gh release create "$TAG" \
              --target "$VALIDATED_SHA" \
              --title "EnergyIQ $TAG" \
              --generate-notes
          fi
