name: Release EnergyIQ version

on:
  push:
    branches:
      - main
    paths:
      - custom_components/energyiq/manifest.json
      - .github/workflows/release-on-version-change.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open('custom_components/energyiq/manifest.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Apply v3.0.7 frontend fixes
        id: frontend_fix
        if: steps.version.outputs.version == '3.0.7'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/energyiq/www/energyiq-panel.js')
          text = path.read_text(encoding='utf-8')

          old_state = 'return `\\n        .table-scroll input.train, .table-scroll input.monitor { width:18px; height:18px; margin:0; }<span class="state-box ${state || "unknown"}">${label}</span>`;'
          new_state = 'return `<span class="state-box ${state || "unknown"}">${label}</span>`;'
          if old_state not in text:
              raise SystemExit('Expected broken renderState markup was not found; refusing to modify the file.')
          text = text.replace(old_state, new_state, 1)

          old_refresh = '''        const scrollerBeforeRender = this.querySelector(".table-scroll");
        const previousScroll = scrollerBeforeRender ? scrollerBeforeRender.scrollTop : this.scrollTop;
        this.workspace = await this.ws({ type: "energy_attribution/workspace", entry_id: this.entryId });
        this.bulk = await this.ws({ type: "energy_attribution/bulk_training_state", entry_id: this.entryId });
        if (this.bulk?.status === "running") this.startBulkPolling(); else this.stopBulkPolling();
        this.render(previousScroll);'''
          new_refresh = '''        this.workspace = await this.ws({ type: "energy_attribution/workspace", entry_id: this.entryId });
        this.bulk = await this.ws({ type: "energy_attribution/bulk_training_state", entry_id: this.entryId });
        if (this.bulk?.status === "running") this.startBulkPolling(); else this.stopBulkPolling();
        this.render();'''
          if old_refresh not in text:
              raise SystemExit('Expected refresh implementation was not found; refusing to modify the file.')
          text = text.replace(old_refresh, new_refresh, 1)

          text = text.replace('this.render(this.scrollTop);\n          if (this.bulk?.status !== "running") this.stopBulkPolling();', 'this.render();\n          if (this.bulk?.status !== "running") this.stopBulkPolling();', 1)

          old_render = '''    render(previousScroll = 0) {
      if (!this.workspace) return;
      this.scrollTop = previousScroll;'''
          new_render = '''    render(previousScroll = null) {
      if (!this.workspace) return;
      if (previousScroll === null) {
        const scroller = this.querySelector(".table-scroll");
        previousScroll = scroller ? scroller.scrollTop : this.scrollTop;
      }
      this.scrollTop = previousScroll;'''
          if old_render not in text:
              raise SystemExit('Expected render implementation was not found; refusing to modify the file.')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js
          git commit -m 'Fix v3.0.7 table rendering and scroll preservation'
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set release target
        id: target
        shell: bash
        run: |
          if [ -n "${{ steps.frontend_fix.outputs.release_sha }}" ]; then
            echo "sha=${{ steps.frontend_fix.outputs.release_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release if missing
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(err => err.status === 404 ? null : Promise.reject(err));
            if (existing) {
              core.info(`Release ${tag} already exists.`);
              return;
            }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: process.env.RELEASE_SHA,
              name: `EnergyIQ ${tag}`,
              body: `EnergyIQ ${tag}\n\nAutomated release.`,
              draft: false,
              prerelease: false
            });
