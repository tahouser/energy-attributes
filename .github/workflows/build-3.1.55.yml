name: Build EnergyIQ 3.1.55

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Start EnergyIQ 3.1.55 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Rebuild 3.1.55 from permanent 3.1.36 baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cef34f051a540700c96f0427d9fcd953290ba0a
          git checkout cef34f051a540700c96f0427d9fcd953290ba66c -- .
          python - <<'PY'
          from pathlib import Path
          import base64
          root = Path('.')
          p = root / 'custom_components/energyiq/manifest.json'; s = p.read_text(); s = s.replace('"version": "3.1.36"', '"version": "3.1.55"'); p.write_text(s)
          p = root / 'custom_components/energyiq/__init__.py'; s = p.read_text(); s = s.replace('FRONTEND_VERSION = "31360"', 'FRONTEND_VERSION = "31550"'); s = s.replace('sidebar_title="EnergyIQ • v3.1.36"', 'sidebar_title="EnergyIQ • v3.1.55"'); s = s.replace('sidebar_icon="mdi:lightning-bolt"', 'sidebar_icon="mdi:home-lightning-bolt"'); p.write_text(s)
          p = root / 'custom_components/energyiq/config_flow.py'; s = p.read_text(); needle = '    candidates = []\n'; insert = '''    candidates = []\n    browser_mod_config_entry_ids = {\n        entry.entry_id for entry in hass.config_entries.async_entries("browser_mod")\n    }\n'''; assert needle in s; s = s.replace(needle, insert, 1); device_needle = '        device = device_registry.async_get_or_create(\n'; assert device_needle in s; s = s.replace(device_needle, '        if set(device.config_entries) & browser_mod_config_entry_ids:\n            continue\n\n' + device_needle, 1); p.write_text(s)
          p = root / 'custom_components/energyiq/www/energyiq-panel.js'; s = p.read_text(); s = s.replace('const VERSION = "31360";', 'const VERSION = "31550";', 1); s = s.replace('.shell{padding:18px 20px;max-width:1600px;margin:auto}', '.shell{padding:18px 20px;max-width:1600px;margin:auto;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column}', 1); s = s.replace('.table-scroll{overflow:auto;max-height:calc(100vh - 330px);border:1px solid var(--divider-color);border-radius:10px}', '.table-scroll{overflow:auto;flex:1 1 auto;min-height:0;max-height:none;border:1px solid var(--divider-color);border-radius:10px}', 1); s = s.replace('.table-scroll{max-height:none}', '.table-scroll{flex:1 1 auto;min-height:0;max-height:none}', 1); p.write_text(s)
          logo_b64 = ''''''
          (root / 'custom_components/energyiq/brand/logo.png').write_bytes(base64.b64decode(logo_b64))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'EnergyIQ 3.1.55 attempt from 3.1.36'
          git push origin HEAD:main
