name: Fix Full Cycle frontend cache-busting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Add Full Cycle frontend cache-busting fix workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch frontend identity and version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = Path('custom_components/energyiq/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '3.1.24'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          init = Path('custom_components/energyiq/__init__.py')
          s = init.read_text()
          s = s.replace('FRONTEND_VERSION = "31230"', 'FRONTEND_VERSION = "31240"')
          s = s.replace('webcomponent_name="energyiq-panel-v316"', 'webcomponent_name="energyiq-panel-v324"')
          s = s.replace('sidebar_title="EnergyIQ • v3.1.23"', 'sidebar_title="EnergyIQ • v3.1.24"')
          init.write_text(s)

          js = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = js.read_text()
          s = s.replace('const TAG = "energyiq-panel-v316";', 'const TAG = "energyiq-panel-v324";')
          js.write_text(s)

          validate = Path('.github/workflows/validate.yml')
          s = validate.read_text()
          s = s.replace("assert panel_id == 'energyiq-panel-v316'", "assert panel_id == 'energyiq-panel-v324'")
          validate.write_text(s)

          workflow = Path('.github/workflows/fix-full-cycle-frontend.yml')
          workflow.unlink()
          PY
      - name: Commit permanent fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py custom_components/energyiq/www/energyiq-panel.js .github/workflows/validate.yml .github/workflows/fix-full-cycle-frontend.yml
          git commit -m 'Fix Full Cycle frontend loading and bump to v3.1.24'
          git push
