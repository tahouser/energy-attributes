name: EnergyIQ layout update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update summary layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = Path('custom_components/energyiq/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '3.0.3'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          init = Path('custom_components/energyiq/__init__.py')
          text = init.read_text()
          text = text.replace('FRONTEND_VERSION = "3020"', 'FRONTEND_VERSION = "3030"')
          text = text.replace('webcomponent_name="energyiq-panel-v302"', 'webcomponent_name="energyiq-panel-v303"')
          text = text.replace('sidebar_title="EnergyIQ • v3.0.2"', 'sidebar_title="EnergyIQ • v3.0.3"')
          init.write_text(text)

          panel = Path('custom_components/energyiq/www/energyiq-panel.js')
          text = panel.read_text()
          text = text.replace('const TAG = "energyiq-panel-v302";', 'const TAG = "energyiq-panel-v303";', 1)
          text = text.replace('const VERSION = "3.0.2";', 'const VERSION = "3.0.3";', 1)
          old = '.summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin:12px 0 16px}'
          new = '.summary{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px;margin:12px 0 16px}'
          if old not in text:
              raise SystemExit('Expected summary CSS was not found')
          text = text.replace(old, new, 1)
          text = text.replace('@media(max-width:900px){.summary{grid-template-columns:repeat(3,minmax(120px,1fr))}', '@media(max-width:900px){.summary{grid-template-columns:repeat(2,minmax(160px,1fr))}', 1)
          panel.write_text(text)
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js
      - name: Commit layout update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py custom_components/energyiq/www/energyiq-panel.js
          git commit -m "EnergyIQ 3.0.3 two-row summary layout [skip ci]"
          git push
      - name: Remove temporary workflows
        shell: bash
        run: |
          git rm -f .github/workflows/energyiq-layout-update.yml .github/workflows/energyiq-revision-test.yml || true
          git commit -m "Remove temporary EnergyIQ update workflows [skip ci]" || true
          git push || true
