name: EnergyIQ revision test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  revision:
    if: "!contains(github.event.head_commit.message, 'EnergyIQ revision test')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make tiny visible revision change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = Path('custom_components/energyiq/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '3.0.3'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          init = Path('custom_components/energyiq/__init__.py')
          text = init.read_text()
          text = text.replace('FRONTEND_VERSION = "3020"', 'FRONTEND_VERSION = "3030"')
          text = text.replace('webcomponent_name="energyiq-panel-v302"', 'webcomponent_name="energyiq-panel-v303"')
          text = text.replace('module_url=f"{URL_BASE}/energyiq-panel.js?v={FRONTEND_VERSION}"', 'module_url=f"{URL_BASE}/energyiq-panel.js?v={FRONTEND_VERSION}"')
          text = text.replace('sidebar_title="EnergyIQ • v3.0.2"', 'sidebar_title="EnergyIQ • v3.0.3"')
          init.write_text(text)

          panel = Path('custom_components/energyiq/www/energyiq-panel.js')
          text = panel.read_text()
          text = text.replace('const TAG = "energyiq-panel-v302";', 'const TAG = "energyiq-panel-v303";', 1)
          text = text.replace('const VERSION = "3.0.2";', 'const VERSION = "3.0.3";', 1)
          text = text.replace('Whole-home electrical intelligence · v${VERSION}', 'Whole-home electrical intelligence · v${VERSION} · Revision test', 1)
          panel.write_text(text)
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js
      - name: Commit revision test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py custom_components/energyiq/www/energyiq-panel.js
          git commit -m "EnergyIQ revision test [skip ci]"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/energyiq-revision-test.yml
          git commit -m "Remove EnergyIQ revision test workflow [skip ci]"
          git push
