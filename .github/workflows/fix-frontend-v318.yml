name: Apply EnergyIQ v3.1.18 frontend isolation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply EnergyIQ v3.1.18 frontend isolation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          panel = root / 'custom_components/energyiq/www/energyiq-panel.js'
          text = panel.read_text(encoding='utf-8')
          old = 'const TAG = "energyiq-panel-v309";'
          new = 'const TAG = "energyiq-panel-v315";'
          assert old in text
          panel.write_text(text.replace(old, new, 1), encoding='utf-8')
          (root / 'custom_components/energyiq/www/energyiq-loader-v315.js').write_text('''/* EnergyIQ version-isolated frontend loader. */\nconst path = "./energyiq-panel.js?v=315";\ntry {\n  await import(path);\n  const TAG = "energyiq-panel-v315";\n  if (!customElements.get(TAG)) throw new Error("EnergyIQ panel element was not registered.");\n} catch (error) {\n  console.error("EnergyIQ frontend loader failed", error);\n  throw error;\n}\n''', encoding='utf-8')
          init = root / 'custom_components/energyiq/__init__.py'
          text = init.read_text(encoding='utf-8')
          for old, new in {
              'FRONTEND_VERSION = "31170"': 'FRONTEND_VERSION = "31180"',
              'webcomponent_name="energyiq-panel-v314"': 'webcomponent_name="energyiq-panel-v315"',
              'module_url=f"{URL_BASE}/energyiq-loader-v314.js?v={FRONTEND_VERSION}"': 'module_url=f"{URL_BASE}/energyiq-loader-v315.js?v={FRONTEND_VERSION}"',
              'sidebar_title="EnergyIQ • v3.1.17"': 'sidebar_title="EnergyIQ • v3.1.18"',
          }.items():
              assert old in text
              text = text.replace(old, new, 1)
          init.write_text(text, encoding='utf-8')
          manifest = root / 'custom_components/energyiq/manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data['version'] == '3.1.17'
          data['version'] = '3.1.18'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          state = root / 'STATE.md'
          text = state.read_text(encoding='utf-8').replace('**Current release:** v3.1.1', '**Current release:** v3.1.18', 1)
          text = text.replace('The frontend custom-element identity is stable and must not be changed for ordinary version bumps.', 'The frontend uses a version-isolated custom-element identity for frontend releases; ordinary backend-only version bumps should not change it.')
          state.write_text(text, encoding='utf-8')
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js
          node --check custom_components/energyiq/www/energyiq-loader-v315.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/www/energyiq-loader-v315.js custom_components/energyiq/__init__.py custom_components/energyiq/manifest.json STATE.md
          git commit -m 'Apply EnergyIQ v3.1.18 frontend isolation fix'
          git push
