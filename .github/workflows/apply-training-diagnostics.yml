name: Apply Quick training diagnostics

on:
  push:
    paths:
      - .github/workflows/apply-training-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply diagnostics display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js = Path('custom_components/energyiq/www/energyiq-panel.js')
          text = js.read_text(encoding='utf-8')
          if 'const VERSION = "3.1.2";' not in text:
              raise SystemExit('Expected v3.1.2 frontend marker not found')
          text = text.replace('const VERSION = "3.1.2";', 'const VERSION = "3.1.3";', 1)

          old = '''    trainingLabel(training) {\n      const status = training?.status || "not trained";\n      if (status === "active") return training.instruction || `Training: ${training.phase || "in progress"}`;\n      if (status === "complete") return "Complete";\n      if (status === "error") return `Error: ${training.error || training.instruction || "training failed"}`;\n      if (status === "stopped") return "Stopped";\n      if (status === "interrupted") return "Interrupted";\n      return "Not trained";\n    }'''
          new = '''    quickObservationText(training) {\n      const observations = training?.result?.observations || training?.learned_signature?.observations || [];\n      if (!Array.isArray(observations) || !observations.length) return "";\n      return observations.map((item, index) => {\n        const value = Number(item?.delta_w);\n        return `C${index + 1}: ${Number.isFinite(value) ? value.toFixed(0) : "—"} W`;\n      }).join(" · ");\n    }\n\n    trainingLabel(training) {\n      const status = training?.status || "not trained";\n      const observations = this.quickObservationText(training);\n      if (status === "active") {\n        const base = training.instruction || `Training: ${training.phase || "in progress"}`;\n        return observations ? `${base} · ${observations}` : base;\n      }\n      if (status === "complete") return observations ? `Complete · ${observations}` : "Complete";\n      if (status === "error") {\n        const base = training.error || training.instruction || "training failed";\n        return observations ? `Error: ${base} · ${observations}` : `Error: ${base}`;\n      }\n      if (status === "stopped") return observations ? `Stopped · ${observations}` : "Stopped";\n      if (status === "interrupted") return "Interrupted";\n      return "Not trained";\n    }'''
          if old not in text:
              raise SystemExit('Expected trainingLabel block not found')
          text = text.replace(old, new, 1)

          old = '''        const training = device.training || {};\n        const liveDelta = Number(training.live_delta_w);\n        const normalPower = Number(device.current_power);\n        const power = training.status === "active" && Number.isFinite(liveDelta) ? liveDelta : normalPower;'''
          new = '''        const training = device.training || {};\n        const liveDelta = Number(training.live_delta_w);\n        const resultDelta = Number(training.result?.peak_delta_w);\n        const normalPower = Number(device.current_power);\n        const power = training.status === "active"\n          ? (Number.isFinite(liveDelta) ? liveDelta : (Number.isFinite(resultDelta) ? resultDelta : normalPower))\n          : normalPower;'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two power blocks, found {text.count(old)}')
          text = text.replace(old, new)

          js.write_text(text, encoding='utf-8')

          init = Path('custom_components/energyiq/__init__.py')
          text = init.read_text(encoding='utf-8')
          for old, new in [
              ('FRONTEND_VERSION = "3120"', 'FRONTEND_VERSION = "3130"'),
              ('sidebar_title="EnergyIQ • v3.1.2"', 'sidebar_title="EnergyIQ • v3.1.3"'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected init marker not found: {old}')
              text = text.replace(old, new, 1)
          if 'webcomponent_name="energyiq-panel-v309"' not in text:
              raise SystemExit('Stable frontend element identity changed unexpectedly')
          init.write_text(text, encoding='utf-8')

          manifest = Path('custom_components/energyiq/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if data.get('version') != '3.1.2':
              raise SystemExit(f'Unexpected manifest version: {data.get("version")}')
          data['version'] = '3.1.3'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q custom_components/energyiq tests
          node --check custom_components/energyiq/www/energyiq-panel.js
          grep -q 'const TAG = "energyiq-panel-v309"' custom_components/energyiq/www/energyiq-panel.js
          grep -q 'const VERSION = "3.1.3"' custom_components/energyiq/www/energyiq-panel.js
          grep -q 'webcomponent_name="energyiq-panel-v309"' custom_components/energyiq/__init__.py
          grep -q 'FRONTEND_VERSION = "3130"' custom_components/energyiq/__init__.py
          grep -q 'sidebar_title="EnergyIQ • v3.1.3"' custom_components/energyiq/__init__.py
          python - <<'PY'
          import json
          with open('custom_components/energyiq/manifest.json', encoding='utf-8') as f:
              assert json.load(f)['version'] == '3.1.3'
          PY

      - name: Commit final change and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/__init__.py custom_components/energyiq/manifest.json
          git commit -m 'Show Quick training measurements in workspace'
          git rm .github/workflows/apply-training-diagnostics.yml
          git commit -m 'Remove temporary training diagnostics workflow'
          git push origin HEAD:main

      - name: Create release from final commit
        uses: actions/github-script@v7
        env:
          VERSION: '3.1.3'
        with:
          script: |
            const { stdout } = await exec.getExecOutput('git', ['rev-parse', 'HEAD']);
            const target = stdout.trim();
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(err => err.status === 404 ? null : Promise.reject(err));
            if (existing) {
              core.info(`Release ${tag} already exists.`);
              return;
            }
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: target,
              name: `EnergyIQ ${tag}`,
              body: 'Show live Quick training watts and the three captured ON/OFF cycle deltas during and after training. No training acceptance criteria changed.',
              draft: false,
              prerelease: false
            });
            core.info(`Published ${release.html_url} at ${target}`);
