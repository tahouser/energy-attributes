name: Apply EnergyIQ Quick ON time fix

on:
  push:
    paths:
      - .github/workflows/apply-quick-on-time-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increase Quick ON measurement time
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('custom_components/energyiq/training.py')
          text = path.read_text(encoding='utf-8')
          old = '    quick_on_measurement_s: float = 3.0'
          new = '    quick_on_measurement_s: float = 5.0'
          if old not in text:
              raise SystemExit('Expected Quick ON measurement setting was not found; refusing to modify the file.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          manifest_path = Path('custom_components/energyiq/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '3.1.0'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          init_path = Path('custom_components/energyiq/__init__.py')
          init = init_path.read_text(encoding='utf-8')
          init = init.replace('FRONTEND_VERSION = "3090"', 'FRONTEND_VERSION = "3100"', 1)
          init = init.replace('webcomponent_name="energyiq-panel-v309"', 'webcomponent_name="energyiq-panel-v310"', 1)
          init = init.replace('sidebar_title="EnergyIQ • v3.0.9"', 'sidebar_title="EnergyIQ • v3.1.0"', 1)
          init_path.write_text(init, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m compileall -q custom_components/energyiq tests

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/energyiq/training.py custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py
          git commit -m "Increase Quick training ON measurement to five seconds"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-quick-on-time-fix.yml
          git add .github/workflows/apply-quick-on-time-fix.yml
          git commit -m "Remove temporary Quick ON time workflow"
          git push

      - name: Create release
        uses: actions/github-script@v7
        env:
          VERSION: 3.1.0
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(err => err.status === 404 ? null : Promise.reject(err));
            if (existing) return;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.ref.replace('refs/heads/', '')
            });
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: branch.data.commit.sha,
              name: `EnergyIQ ${tag}`,
              body: `EnergyIQ ${tag}\n\nIncrease Quick ON measurement time from 3 seconds to 5 seconds for more stable power capture.`,
              draft: false,
              prerelease: false
            });