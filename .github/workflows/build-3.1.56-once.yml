name: EnergyIQ 3.1.56 one-time build

on:
  push:
    branches: [main]
    paths:
      - '_ENERGYIQ_BUILD_3_1_56'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 3.1.56 fresh from permanent v3.1.36 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=cef34f051a540700c96f0427d9fcd953290ba66c
          git fetch origin "$BASE"
          git checkout "$BASE" -- .
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Product version.
          p = root / 'custom_components/energyiq/manifest.json'
          s = p.read_text()
          assert '"version": "3.1.36"' in s
          p.write_text(s.replace('"version": "3.1.36"', '"version": "3.1.56"', 1))

          # Proven-good sidebar icon, with the new attempt's version identifiers.
          p = root / 'custom_components/energyiq/__init__.py'
          s = p.read_text()
          assert 'FRONTEND_VERSION = "31360"' in s
          assert 'sidebar_title="EnergyIQ • v3.1.36"' in s
          assert 'sidebar_icon="mdi:lightning-bolt"' in s
          s = s.replace('FRONTEND_VERSION = "31360"', 'FRONTEND_VERSION = "31560"', 1)
          s = s.replace('sidebar_title="EnergyIQ • v3.1.36"', 'sidebar_title="EnergyIQ • v3.1.56"', 1)
          s = s.replace('sidebar_icon="mdi:lightning-bolt"', 'sidebar_icon="mdi:home-lightning-bolt"', 1)
          p.write_text(s)

          # Preserve the proven Browser Mod exclusion without touching the complete
          # entity-registry browser or monitoring persistence logic.
          p = root / 'custom_components/energyiq/config_flow.py'
          s = p.read_text()
          needle = '    candidates: list[dict[str, Any]] = []\n'
          assert needle in s
          insert = needle + '    browser_mod_config_entry_ids = {entry.entry_id for entry in hass.config_entries.async_entries("browser_mod")}\n'
          s = s.replace(needle, insert, 1)
          needle = '    for device in all_devices:\n'
          assert needle in s
          s = s.replace(needle, needle + '        if set(device.config_entries) & browser_mod_config_entry_ids:\n            continue\n', 1)
          p.write_text(s)

          # Frontend: remove the inner list scroller. Let the HA custom panel page
          # provide the vertical scroll, while keeping the title/summary/toolbar
          # visible as a sticky header.
          p = root / 'custom_components/energyiq/www/energyiq-panel.js'
          s = p.read_text()
          assert 'const VERSION = "31360";' in s
          s = s.replace('const VERSION = "31360";', 'const VERSION = "31560";', 1)

          assert '<div class="shell"><header>' in s
          s = s.replace('<div class="shell"><header>', '<div class="shell"><div class="page-header"><header>', 1)
          marker = '${this.trainingWorkspaceOpen ? `<div id="training-area">${this.renderTrainingWorkspace()}</div>` : ""}<div class="toolbar">'
          assert marker in s
          # Keep the training workspace in normal flow, but keep the controls above
          # the monitored-load list in the sticky header.
          s = s.replace(marker, '${this.trainingWorkspaceOpen ? `<div id="training-area">${this.renderTrainingWorkspace()}</div>` : ""}<div class="toolbar">', 1)
          marker = '</div><div class="table-scroll"><table>'
          assert marker in s
          s = s.replace(marker, '</div></div><div class="table-wrap"><table>', 1)

          old_css = '.table-scroll{overflow:auto;max-height:calc(100vh - 330px);border:1px solid var(--divider-color);border-radius:10px}'
          assert old_css in s
          new_css = '.page-header{position:sticky;top:0;z-index:5;background:var(--primary-background-color);padding-bottom:10px}.table-wrap{border:1px solid var(--divider-color);border-radius:10px}'
          s = s.replace(old_css, new_css, 1)
          # The table header previously stuck inside the removed scrolling container.
          # Keep it in normal flow so it cannot hide underneath the persistent page header.
          s = s.replace('th{position:sticky;top:0;', 'th{position:static;', 1)
          p.write_text(s)

          # The square EnergyIQ icon is already the correct artwork. Removing the
          # competing logo lets HA use the icon as the logo fallback on configuration
          # pages, per the HA branding rules.
          logo = root / 'custom_components/energyiq/brand/logo.png'
          assert logo.exists()
          logo.unlink()
          PY

          rm -f _ENERGYIQ_BUILD_3_1_56
          rm -f .github/workflows/build-3.1.56-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'EnergyIQ 3.1.56 attempt from v3.1.36'
          git push origin HEAD:main
