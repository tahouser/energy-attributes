name: Patch Full Cycle stop session

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Add Full Cycle stop-session patch workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch websocket stop handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('custom_components/energyiq/websocket.py')
          s = p.read_text()
          old = '''@websocket_api.websocket_command({
              vol.Required("type"): "energy_attribution/stop_training",
              vol.Required("entry_id"): str,
              vol.Required("device_id"): str,
          })
          @websocket_api.require_admin
          @websocket_api.async_response
          async def ws_stop_training(hass, connection, msg):
              coordinator = _coordinator(hass, msg["entry_id"])
              await coordinator.async_stop_training(msg["device_id"])
              connection.send_result(msg["id"], {"stopped": True})
          '''
          new = '''@websocket_api.websocket_command({
              vol.Required("type"): "energy_attribution/stop_training",
              vol.Required("entry_id"): str,
              vol.Required("device_id"): str,
          })
          @websocket_api.require_admin
          @websocket_api.async_response
          async def ws_stop_training(hass, connection, msg):
              coordinator = _coordinator(hass, msg["entry_id"])
              device_id = msg["device_id"]
              if coordinator._training_device != device_id or coordinator._training_engine is None:
                  raise ValueError("No active training session exists for this device")
              state = coordinator.training_state.get(device_id, {})
              state["status"] = "stopped"
              state["phase"] = "stopped"
              state["instruction"] = "Training stopped without saving a new signature."
              state["completed"] = False
              state["learned"] = False
              task = coordinator._training_task
              coordinator._training_engine = None
              coordinator._training_device = None
              if coordinator._direct_rpc_task and not coordinator._direct_rpc_task.done():
                  coordinator._direct_rpc_task.cancel()
                  try:
                      await coordinator._direct_rpc_task
                  except asyncio.CancelledError:
                      pass
              if task and not task.done() and task is not asyncio.current_task():
                  task.cancel()
                  try:
                      await task
                  except asyncio.CancelledError:
                      pass
              coordinator._training_task = None
              await coordinator._persist(force=True)
              connection.send_result(msg["id"], {"stopped": True})
          '''
          if old not in s:
              raise SystemExit('Expected ws_stop_training block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/websocket.py
          git diff --cached --quiet || git commit -m 'Fix Full Cycle training stop handling'
          git push
