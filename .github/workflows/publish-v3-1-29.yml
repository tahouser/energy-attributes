name: Publish EnergyIQ v3.1.29
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release
        run: |
          python -m compileall -q custom_components/energyiq tests
          node --check custom_components/energyiq/www/energyiq-panel.js
          test "$(python -c "import json; print(json.load(open('custom_components/energyiq/manifest.json'))['version'])")" = "3.1.29"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1.29 >/dev/null 2>&1 || gh release create v3.1.29 --title 'EnergyIQ v3.1.29' --generate-notes
      - name: Remove temporary trigger files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f VERSION_TRIGGER.txt .github/workflows/publish-v3-1-29.yml
          git commit -m 'Remove v3.1.29 release trigger'
          git push
