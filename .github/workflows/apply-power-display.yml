name: Apply training power display

on:
  push:
    paths:
      - .github/workflows/apply-power-display.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js = Path('custom_components/energyiq/www/energyiq-panel.js')
          text = js.read_text(encoding='utf-8')
          old_version = 'const VERSION = "3.0.9";'
          if old_version not in text:
              raise SystemExit('Expected frontend version marker not found')
          text = text.replace(old_version, 'const VERSION = "3.1.2";', 1)

          old = '''        const power = Number(device.current_power);\n        const powerCell = row.querySelector(".power-cell");\n        if (powerCell) powerCell.textContent = Number.isFinite(power) ? `${power.toFixed(0)} W` : "—";\n        const stateCell = row.querySelector(".state-cell");\n        if (stateCell) stateCell.innerHTML = this.renderState(device);\n        const training = device.training || {};'''
          new = '''        const training = device.training || {};\n        const liveDelta = Number(training.live_delta_w);\n        const normalPower = Number(device.current_power);\n        const power = training.status === "active" && Number.isFinite(liveDelta) ? liveDelta : normalPower;\n        const powerCell = row.querySelector(".power-cell");\n        if (powerCell) powerCell.textContent = Number.isFinite(power) ? `${power.toFixed(0)} W` : "—";\n        const stateCell = row.querySelector(".state-cell");\n        if (stateCell) stateCell.innerHTML = this.renderState(device);'''
          if old not in text:
              raise SystemExit('Expected live update power block not found')
          text = text.replace(old, new, 1)

          old_row = '''      const power = Number(device.current_power);\n      const action = training.status === "active"'''
          new_row = '''      const liveDelta = Number(training.live_delta_w);\n      const normalPower = Number(device.current_power);\n      const power = training.status === "active" && Number.isFinite(liveDelta) ? liveDelta : normalPower;\n      const action = training.status === "active"'''
          if old_row not in text:
              raise SystemExit('Expected row power block not found')
          text = text.replace(old_row, new_row, 1)
          js.write_text(text, encoding='utf-8')

          init = Path('custom_components/energyiq/__init__.py')
          text = init.read_text(encoding='utf-8')
          replacements = [
              ('FRONTEND_VERSION = "3090"', 'FRONTEND_VERSION = "3120"'),
              ('sidebar_title="EnergyIQ • v3.1.1"', 'sidebar_title="EnergyIQ • v3.1.2"'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected init marker not found: {old}')
              text = text.replace(old, new, 1)
          if 'webcomponent_name="energyiq-panel-v309"' not in text:
              raise SystemExit('Stable frontend element identity changed unexpectedly')
          init.write_text(text, encoding='utf-8')

          manifest = Path('custom_components/energyiq/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if data.get('version') != '3.1.1':
              raise SystemExit(f'Unexpected manifest version: {data.get("version")}')
          data['version'] = '3.1.2'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q custom_components/energyiq tests
          node --check custom_components/energyiq/www/energyiq-panel.js
          grep -q 'const TAG = "energyiq-panel-v309"' custom_components/energyiq/www/energyiq-panel.js
          grep -q 'webcomponent_name="energyiq-panel-v309"' custom_components/energyiq/__init__.py
          grep -q 'FRONTEND_VERSION = "3120"' custom_components/energyiq/__init__.py
          grep -q 'sidebar_title="EnergyIQ • v3.1.2"' custom_components/energyiq/__init__.py
          python - <<'PY'
          import json
          with open('custom_components/energyiq/manifest.json', encoding='utf-8') as f:
              assert json.load(f)['version'] == '3.1.2'
          PY

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/__init__.py custom_components/energyiq/manifest.json .github/workflows/apply-power-display.yml
          git commit -m 'Show live training watts in Power column'
          git rm .github/workflows/apply-power-display.yml
          git commit -m 'Remove temporary power display workflow'
          git push origin HEAD:main

      - name: Create release
        uses: actions/github-script@v7
        env:
          VERSION: '3.1.2'
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(err => err.status === 404 ? null : Promise.reject(err));
            if (existing) {
              core.info(`Release ${tag} already exists.`);
              return;
            }
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `EnergyIQ ${tag}`,
              body: 'Show the estimated device watts from live training data in the Power column while Quick ON/OFF training is active.',
              draft: false,
              prerelease: false
            });
            core.info(`Published ${release.html_url}`);
