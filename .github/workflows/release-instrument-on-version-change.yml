name: Release EnergyIQ on version change

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/energyiq/manifest.json'
      - '.github/workflows/release-instrument-on-version-change.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import json; print(json.load(open("custom_components/energyiq/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Replace stale v3.1.60 release when this revision is 3.1.60
        if: steps.version.outputs.version == '3.1.60'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v3.1.60 --yes >/dev/null 2>&1 || true
          git push origin --delete refs/tags/v3.1.60 >/dev/null 2>&1 || true
          git tag -f v3.1.60 "$GITHUB_SHA"
          git push origin refs/tags/v3.1.60 --force
          gh release create v3.1.60 --target "$GITHUB_SHA" --title "EnergyIQ v3.1.60" --generate-notes
