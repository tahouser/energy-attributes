name: Repair EnergyIQ panel v302

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Repair EnergyIQ panel v302')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update panel identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("custom_components/energyiq/www/energyiq-panel.js")
          text = p.read_text()
          text = text.replace('const TAG = "energyiq-panel-v301";', 'const TAG = "energyiq-panel-v302";', 1)
          text = text.replace('const VERSION = "3.0.1";', 'const VERSION = "3.0.2";', 1)
          p.write_text(text)
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/energyiq/www/energyiq-panel.js
          git commit -m "Repair EnergyIQ panel v302 [skip ci]"
          git push
