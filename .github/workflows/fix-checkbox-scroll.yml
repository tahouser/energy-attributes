name: Fix EnergyIQ checkbox scroll
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checkbox interaction fix and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path('custom_components/energyiq/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest['version'] != '3.1.27':
              raise SystemExit(f"Unexpected version: {manifest['version']}")
          manifest['version'] = '3.1.28'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          init_path = Path('custom_components/energyiq/__init__.py')
          init = init_path.read_text()
          init = init.replace('FRONTEND_VERSION = "31270"', 'FRONTEND_VERSION = "31280"', 1)
          init = init.replace('sidebar_title="EnergyIQ • v3.1.27"', 'sidebar_title="EnergyIQ • v3.1.28"', 1)
          init_path.write_text(init)

          js_path = Path('custom_components/energyiq/www/energyiq-panel.js')
          js = js_path.read_text()
          old_train = '''      this.querySelectorAll("[data-train]").forEach(box => box.addEventListener("change", event => { const id = event.currentTarget.dataset.train; if (event.currentTarget.checked) this.trainSelected.add(id); else this.trainSelected.delete(id); this.render(); }));'''
          new_train = '''      this.querySelectorAll("[data-train]").forEach(box => box.addEventListener("change", event => { const id = event.currentTarget.dataset.train; if (event.currentTarget.checked) this.trainSelected.add(id); else this.trainSelected.delete(id); const bulkButton = this.querySelector("#bulk-train"); if (bulkButton) { bulkButton.disabled = this.trainSelected.size === 0; bulkButton.textContent = `Auto Train Selected (${this.trainSelected.size})`; } }));'''
          if old_train not in js:
              raise SystemExit('train checkbox handler target not found')
          js = js.replace(old_train, new_train, 1)

          old_monitor = '''      this.querySelectorAll("[data-monitor]").forEach(box => box.addEventListener("change", event => { const scroller = this.querySelector(".table-scroll"), scrollTop = scroller ? scroller.scrollTop : 0, scrollLeft = scroller ? scroller.scrollLeft : 0, selected = this.getSelectedIds(), id = event.currentTarget.dataset.monitor; if (event.currentTarget.checked) selected.add(id); else selected.delete(id); this.pending = selected; this.render(); requestAnimationFrame(() => { const nextScroller = this.querySelector(".table-scroll"); if (nextScroller) { nextScroller.scrollTop = scrollTop; nextScroller.scrollLeft = scrollLeft; } }); }));'''
          new_monitor = '''      this.querySelectorAll("[data-monitor]").forEach(box => box.addEventListener("change", event => { const selected = this.getSelectedIds(), id = event.currentTarget.dataset.monitor, checked = event.currentTarget.checked; if (checked) selected.add(id); else selected.delete(id); this.pending = selected; const row = event.currentTarget.closest("tr"), trainBox = row?.querySelector("[data-train]"); if (trainBox) trainBox.disabled = !checked; }));'''
          if old_monitor not in js:
              raise SystemExit('monitor checkbox handler target not found')
          js = js.replace(old_monitor, new_monitor, 1)
          js_path.write_text(js)
          PY
      - name: Validate changes
        run: |
          python -m compileall -q custom_components/energyiq tests
          node --check custom_components/energyiq/www/energyiq-panel.js
          grep -q '"version": "3.1.28"' custom_components/energyiq/manifest.json
          grep -q 'FRONTEND_VERSION = "31280"' custom_components/energyiq/__init__.py
          grep -q 'this.render();' custom_components/energyiq/www/energyiq-panel.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/manifest.json custom_components/energyiq/__init__.py custom_components/energyiq/www/energyiq-panel.js
          git commit -m 'Fix EnergyIQ checkbox scrolling'
          git rm .github/workflows/fix-checkbox-scroll.yml
          git commit -m 'Remove temporary checkbox scroll workflow'
          git push
