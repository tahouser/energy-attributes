name: Fix Full Cycle controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Full Cycle to use existing long-cycle API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = p.read_text()
          old = '''    async fullCycleAction(deviceId, action) { try { await this.ws({ type: "energy_attribution/full_cycle_action", entry_id: this.entryId, device_id: deviceId, action }); await this.refresh(true); } catch (error) { this.showToast(error?.message || "Unable to control Full Cycle capture", true); } }'''
          new = '''    async fullCycleAction(deviceId, action) {\n      try {\n        if (action === "start_capture") {\n          await this.ws({ type: "energy_attribution/confirm_long_cycle", entry_id: this.entryId, device_id: deviceId, accepted: true });\n        } else if (action === "stop_capture") {\n          await this.ws({ type: "energy_attribution/end_long_cycle", entry_id: this.entryId, device_id: deviceId, force: false });\n        }\n        await this.refresh(true);\n      } catch (error) {\n        this.showToast(error?.message || "Unable to control Full Cycle capture", true);\n      }\n    }'''
          if old not in s:
              raise SystemExit('frontend fullCycleAction block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('custom_components/energyiq/websocket.py')
          s = p.read_text()
          start = s.index('@websocket_api.websocket_command({\n    vol.Required("type"): "energy_attribution/full_cycle_action"')
          end = s.index('@websocket_api.websocket_command({\n    vol.Required("type"): "energy_attribution/retry_training"', start)
          s = s[:start] + s[end:]
          old_reg = ', ws_full_cycle_action, ws_retry_training'
          if old_reg not in s:
              raise SystemExit('temporary websocket registration not found')
          s = s.replace(old_reg, ', ws_retry_training', 1)
          p.write_text(s)
          PY
          python3 -m py_compile custom_components/energyiq/*.py
          node --check custom_components/energyiq/www/energyiq-panel.js
      - name: Commit and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/websocket.py .github/workflows/fix-full-cycle-controls.yml
          git commit -m 'Use existing long-cycle API for Full Cycle controls' || exit 0
          git rm .github/workflows/fix-full-cycle-controls.yml
          git commit -m 'Remove temporary Full Cycle controls workflow'
          git push
