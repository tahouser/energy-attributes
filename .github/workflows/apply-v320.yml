name: Apply EnergyIQ v3.1.20 fast power sensor fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v320.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fast power sensor fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/energyiq/coordinator.py')
          s = p.read_text()

          marker = '    def _shelly_rpc_config(self) -> tuple[str, int, str | None, str | None] | None:\n'
          method = '''    def _fast_power_entity(self) -> str:\n        """Return the fastest available live whole-home power sensor.\n\n        Prefer the Shelly Pro 3EM Total Active Power sensor because Shelly\n        pushes its live measurements to Home Assistant. The direct Shelly RPC\n        sampler remains the primary training source and is even faster.\n        Never use a switch/control entity as a power measurement.\n        """\n        reg = er.async_get(self.hass)\n        candidates = []\n        for entry in reg.entities.values():\n            if entry.domain != "sensor":\n                continue\n            state = self.hass.states.get(entry.entity_id)\n            if state is None:\n                continue\n            attrs = state.attributes\n            if attrs.get("device_class") != "power":\n                continue\n            unit = str(attrs.get("unit_of_measurement") or "").casefold()\n            if unit not in {"w", "kw"}:\n                continue\n            score = 0\n            text = f"{entry.entity_id} {attrs.get('friendly_name', '')}".casefold()\n            if "total_active_power" in text or "total active power" in text:\n                score += 3000\n            if entry.config_entry_id:\n                config_entry = self.hass.config_entries.async_get_entry(entry.config_entry_id)\n                if config_entry and config_entry.domain == "shelly":\n                    score += 1000\n            if entry.entity_id == self.power_entity:\n                score += 500\n            candidates.append((score, entry.entity_id))\n        if candidates:\n            candidates.sort(reverse=True)\n            return candidates[0][1]\n        return self.power_entity\n\n'''
          if marker not in s:
              raise SystemExit('Shelly RPC method marker not found')
          if 'def _fast_power_entity(self)' not in s:
              s = s.replace(marker, method + marker, 1)

          s = s.replace('state = self.hass.states.get(self.power_entity)\n        watts = None', 'power_entity = self._fast_power_entity()\n        state = self.hass.states.get(power_entity)\n        watts = None', 1)
          s = s.replace('"power_entity": self.power_entity,', '"power_entity": power_entity,', 1)

          old = '''        reg = er.async_get(self.hass)\n        entity_entry = reg.async_get(self.power_entity)\n'''
          new = '''        reg = er.async_get(self.hass)\n        fast_entity = self._fast_power_entity()\n        entity_entry = reg.async_get(fast_entity) or reg.async_get(self.power_entity)\n'''
          if old not in s:
              raise SystemExit('Shelly entity lookup block not found')
          s = s.replace(old, new, 1)

          s = s.replace('whole = self.hass.states.get(self.power_entity)\n                    ha_w = None', 'fast_entity = self._fast_power_entity()\n                    whole = self.hass.states.get(fast_entity)\n                    ha_w = None', 1)
          s = s.replace('await self._response_log("shelly_rpc_sample", device_id, shelly_host=host, rpc_source=source, rpc_power_w=round(total, 3), rpc_elapsed_ms=round(elapsed_ms, 2), ha_power_w=ha_w, ha_last_updated=ha_updated)', 'await self._response_log("shelly_rpc_sample", device_id, shelly_host=host, rpc_source=source, rpc_power_w=round(total, 3), rpc_elapsed_ms=round(elapsed_ms, 2), ha_power_w=ha_w, ha_last_updated=ha_updated, power_entity=fast_entity)', 1)

          # If direct RPC is unavailable, fall back to the fastest power sensor,
          # never to a switch/control entity.
          s = s.replace('whole = self.hass.states.get(self.power_entity)\n                    try:\n                        watts = float(whole.state) if whole else None', 'fast_entity = self._fast_power_entity()\n                    whole = self.hass.states.get(fast_entity)\n                    try:\n                        watts = float(whole.state) if whole else None', 1)
          p.write_text(s)

          p = Path('custom_components/energyiq/manifest.json')
          s = p.read_text().replace('"version": "3.1.19"', '"version": "3.1.20"')
          p.write_text(s)

          p = Path('custom_components/energyiq/__init__.py')
          s = p.read_text()
          s = s.replace('FRONTEND_VERSION = "31190"', 'FRONTEND_VERSION = "31200"')
          s = s.replace('sidebar_title="EnergyIQ • v3.1.19"', 'sidebar_title="EnergyIQ • v3.1.20"')
          p.write_text(s)
          PY
          python -m compileall -q custom_components/energyiq
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq .github/workflows/apply-v320.yml
          git commit -m 'Release EnergyIQ v3.1.20 fast power sensor fix'
          git push
          gh release create v3.1.20 --target main --title 'EnergyIQ v3.1.20' --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
