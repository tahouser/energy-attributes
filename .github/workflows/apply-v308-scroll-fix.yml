name: Apply EnergyIQ v3.0.8 scroll fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v308-scroll-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const TAG = "energyiq-panel-v307";', 'const TAG = "energyiq-panel-v308";')
          s = s.replace('const VERSION = "3.0.7";', 'const VERSION = "3.0.8";')
          s = s.replace('      this.scrollTop = 0;\n', '')

          old = '''    async refresh() {
      if (!this.hass || !this.entryId) return;
      try {
        this.workspace = await this.ws({ type: "energy_attribution/workspace", entry_id: this.entryId });
        this.bulk = await this.ws({ type: "energy_attribution/bulk_training_state", entry_id: this.entryId });
        if (this.bulk?.status === "running") this.startBulkPolling(); else this.stopBulkPolling();
        this.render();
      } catch (error) {
        console.error("EnergyIQ refresh failed", error);
      }
    }
'''
          new = '''    async refresh(forceRender = false) {
      if (!this.hass || !this.entryId) return;
      try {
        const hadWorkspace = !!this.workspace;
        this.workspace = await this.ws({ type: "energy_attribution/workspace", entry_id: this.entryId });
        this.bulk = await this.ws({ type: "energy_attribution/bulk_training_state", entry_id: this.entryId });
        if (this.bulk?.status === "running") this.startBulkPolling(); else this.stopBulkPolling();
        if (!hadWorkspace || forceRender) this.render(); else this.updateLiveData();
      } catch (error) {
        console.error("EnergyIQ refresh failed", error);
      }
    }
'''
          if old not in s: raise SystemExit('refresh block not found')
          s = s.replace(old, new, 1)

          s = s.replace('          this.render();\n          if (this.bulk?.status !== "running") this.stopBulkPolling();', '          this.updateLiveData();\n          if (this.bulk?.status !== "running") this.stopBulkPolling();', 1)

          marker = '''    stopBulkPolling() {
      if (this.bulkTimer) clearInterval(this.bulkTimer);
      this.bulkTimer = null;
    }
'''
          addition = '''    stopBulkPolling() {
      if (this.bulkTimer) clearInterval(this.bulkTimer);
      this.bulkTimer = null;
    }

    updateLiveData() {
      const devices = this.getDevices();
      const byId = new Map(devices.map(d => [d.device_id, d]));
      this.querySelectorAll("tr[data-device-id]").forEach(row => {
        const device = byId.get(row.dataset.deviceId);
        if (!device) return;
        const power = Number(device.current_power);
        const powerCell = row.querySelector(".power-cell");
        if (powerCell) powerCell.textContent = Number.isFinite(power) ? `${power.toFixed(0)} W` : "—";
        const stateCell = row.querySelector(".state-cell");
        if (stateCell) stateCell.innerHTML = this.renderState(device);
        const training = device.training || {};
        const trainingCell = row.querySelector(".training");
        if (trainingCell) trainingCell.textContent = this.trainingLabel(training);
        const methodCell = row.querySelector(".method-cell");
        if (methodCell) methodCell.textContent = training.method || "—";
        const actionsCell = row.querySelector(".actions");
        if (actionsCell) {
          const monitored = this.getSelectedIds().has(device.device_id);
          const manual = String(device.source || "").toLowerCase() === "manual";
          const action = training.status === "active"
            ? `<button data-stop="${this.attr(device.device_id)}">Stop</button>`
            : manual
              ? `<button data-manual="${this.attr(device.device_id)}">${training.status === "complete" ? "Retrain Manual" : "Manual Training"}</button>`
              : `<button data-quick="${this.attr(device.device_id)}">Quick ON/OFF</button><button data-full="${this.attr(device.device_id)}">Full Cycle</button>`;
          actionsCell.innerHTML = monitored ? action : "";
        }
      });

      const summary = this.querySelector("#summary-area");
      if (summary) summary.innerHTML = this.renderSummary();
      const bulk = this.querySelector("#bulk-area");
      if (bulk) bulk.innerHTML = this.renderBulk();
      this.bindActionButtons();
    }

    bindActionButtons() {
      this.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => this.startTraining(b.dataset.quick, "quick"));
      this.querySelectorAll("[data-full]").forEach(b => b.onclick = () => this.startTraining(b.dataset.full, "full_cycle"));
      this.querySelectorAll("[data-manual]").forEach(b => b.onclick = () => this.startTraining(b.dataset.manual, "manual"));
      this.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => this.stopTraining(b.dataset.stop));
    }
'''
          if marker not in s: raise SystemExit('stopBulkPolling marker not found')
          s = s.replace(marker, addition, 1)

          old_render = '''    render(previousScroll = null) {
      if (!this.workspace) return;
      if (previousScroll === null) {
        const scroller = this.querySelector(".table-scroll");
        previousScroll = scroller ? scroller.scrollTop : this.scrollTop;
      }
      this.scrollTop = previousScroll;
'''
          new_render = '''    render() {
      if (!this.workspace) return;
'''
          if old_render not in s: raise SystemExit('render scroll block not found')
          s = s.replace(old_render, new_render, 1)

          s = s.replace('          ${this.renderSummary()}${this.renderBulk()}', '          <div id="summary-area">${this.renderSummary()}</div><div id="bulk-area">${this.renderBulk()}</div>', 1)
          s = s.replace('<tr><td><input class="monitor"', '<tr data-device-id="${this.attr(device.device_id)}"><td><input class="monitor"', 1)
          s = s.replace('<td>${Number.isFinite(power) ? `${power.toFixed(0)} W` : "—"}</td><td class="state-cell">', '<td class="power-cell">${Number.isFinite(power) ? `${power.toFixed(0)} W` : "—"}</td><td class="state-cell">', 1)
          s = s.replace('<td class="training">${this.escape(this.trainingLabel(training))}</td><td>${this.escape(training.method || "—")}</td>', '<td class="training">${this.escape(this.trainingLabel(training))}</td><td class="method-cell">${this.escape(training.method || "—")}</td>', 1)

          old = '''      this.bind();
      requestAnimationFrame(() => {
        const scroller = this.querySelector(".table-scroll");
        if (scroller) {
          scroller.scrollTop = this.scrollTop;
          scroller.addEventListener("scroll", () => { this.scrollTop = scroller.scrollTop; }, { passive: true });
        }
      });
'''
          if old not in s: raise SystemExit('scroll restore block not found')
          s = s.replace(old, '      this.bind();\n', 1)

          s = s.replace('this.render(this.scrollTop)', 'this.render()', 10)
          s = s.replace('await this.refresh();', 'await this.refresh(true);')
          s = s.replace('await this.refresh(true);\n        this.refreshTimer', 'await this.refresh();\n        this.refreshTimer', 1)

          s = s.replace('customElements.define(TAG, EnergyIQPanel);', 'customElements.define(TAG, EnergyIQPanel);', 1)
          p.write_text(s, encoding='utf-8')

          init = Path('custom_components/energyiq/__init__.py')
          t = init.read_text(encoding='utf-8').replace('FRONTEND_VERSION = "3070"', 'FRONTEND_VERSION = "3080"').replace('energyiq-panel-v307', 'energyiq-panel-v308').replace('EnergyIQ • v3.0.7', 'EnergyIQ • v3.0.8')
          init.write_text(t, encoding='utf-8')

          manifest = Path('custom_components/energyiq/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '3.0.8'
          manifest.write_text(json.dumps(m, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          node --check custom_components/energyiq/www/energyiq-panel.js
          python -m compileall -q custom_components/energyiq

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/__init__.py custom_components/energyiq/manifest.json .github/workflows/apply-v308-scroll-fix.yml
          git rm .github/workflows/apply-v308-scroll-fix.yml
          git commit -m 'Fix EnergyIQ table scroll persistence'
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          gh release create v3.0.8 --target "$SHA" --title 'EnergyIQ v3.0.8' --notes 'Fix table scrolling so live updates do not reposition the user.'
