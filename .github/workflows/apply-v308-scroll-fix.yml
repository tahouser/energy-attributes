name: EnergyIQ v3.0.8 fix
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        shell: bash
        run: |
          echo '
          ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check custom_components/energyiq/www/energyiq-panel.js
          python -m compileall -q custom_components/energyiq
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/__init__.py custom_components/energyiq/manifest.json
          git commit -m 'Fix EnergyIQ table scroll persistence'
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          gh release create v3.0.8 --target "$SHA" --title 'EnergyIQ v3.0.8' --notes 'Fix table scrolling so live updates do not reposition the user.'
          git rm .github/workflows/apply-v308-scroll-fix.yml
          git commit -m 'Remove temporary v3.0.8 workflow'
          git push origin HEAD:main
