name: Apply Train selection UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-train-selection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("custom_components/energyiq/www/energyiq-panel.js")
          text = js_path.read_text(encoding="utf-8")

          replacements = [
              ('const TAG = "energyiq-panel-v304";', 'const TAG = "energyiq-panel-v305";'),
              ('const VERSION = "3.0.4";', 'const VERSION = "3.0.5";'),
              ('this.pending = null;\n      this.loading', 'this.pending = null;\n      this.trainSelected = new Set();\n      this.loading'),
              ('const selected = this.getSelectedIds();\n      const visible = devices.filter', 'const selected = this.getSelectedIds();\n      const trainSelected = this.trainSelected;\n      const visible = devices.filter'),
              ('<div class="bulk-actions"><button id="bulk-train" ${this.view !== "monitored" || !visible.some(d => d.source !== "manual") ? "disabled" : ""}>Auto Train Monitored</button></div>', '<div class="bulk-actions"><button id="bulk-train" ${trainSelected.size ? "" : "disabled"}>Auto Train Selected (${trainSelected.size})</button></div>'),
              ('<tr><th>Monitor</th><th>Device</th>', '<tr><th>Monitor</th><th>Train</th><th>Device</th>'),
              ('<tr><td colspan="9" class="empty">No loads in this view.</td></tr>', '<tr><td colspan="10" class="empty">No loads in this view.</td></tr>'),
              ('return `<tr><td><input class="monitor" type="checkbox" data-monitor="${this.attr(device.device_id)}" ${monitored ? "checked" : ""}></td>\n        <td><strong>', 'const trainChecked = this.trainSelected.has(device.device_id);\n      return `<tr><td><input class="monitor" type="checkbox" data-monitor="${this.attr(device.device_id)}" ${monitored ? "checked" : ""}></td>\n        <td><input class="train" type="checkbox" data-train="${this.attr(device.device_id)}" ${trainChecked ? "checked" : ""} ${monitored ? "" : "disabled"}></td>\n        <td><strong>'),
              ('      this.querySelectorAll("[data-monitor]").forEach(box => box.addEventListener("change", event => {', '      this.querySelectorAll("[data-train]").forEach(box => box.addEventListener("change", event => {\n        const id = event.currentTarget.dataset.train;\n        if (event.currentTarget.checked) this.trainSelected.add(id); else this.trainSelected.delete(id);\n        this.render(this.scrollTop);\n      }));\n      this.querySelectorAll("[data-monitor]").forEach(box => box.addEventListener("change", event => {'),
              ('  async bulkTrain() {\n      const ids = [...this.getSelectedIds()].filter(id => {\n        const d = this.getDevices().find(x => x.device_id === id);\n        return d && String(d.source || "").toLowerCase() !== "manual";\n      });\n      if (!ids.length || !window.confirm(`Auto Train ${ids.length} monitored HA loads sequentially?`)) return;', '  async bulkTrain() {\n      const ids = [...this.trainSelected];\n      const autoIds = ids.filter(id => {\n        const d = this.getDevices().find(x => x.device_id === id);\n        return d && String(d.source || "").toLowerCase() !== "manual";\n      });\n      if (!autoIds.length || !window.confirm(`Auto Train ${autoIds.length} selected HA loads sequentially?`)) return;'),
              ('await this.ws({ type: "energy_attribution/bulk_auto_training", entry_id: this.entryId, device_ids: ids });', 'await this.ws({ type: "energy_attribution/bulk_auto_training", entry_id: this.entryId, device_ids: autoIds });'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected UI pattern not found: {old[:100]!r}")
              text = text.replace(old, new, 1)

          js_path.write_text(text, encoding="utf-8")

          init_path = Path("custom_components/energyiq/__init__.py")
          init = init_path.read_text(encoding="utf-8")
          for old, new in [
              ('FRONTEND_VERSION = "3040"', 'FRONTEND_VERSION = "3050"'),
              ('webcomponent_name="energyiq-panel-v304"', 'webcomponent_name="energyiq-panel-v305"'),
              ('sidebar_title="EnergyIQ • v3.0.4"', 'sidebar_title="EnergyIQ • v3.0.5"'),
          ]:
              if old not in init:
                  raise SystemExit(f"Expected init pattern not found: {old!r}")
              init = init.replace(old, new, 1)
          init_path.write_text(init, encoding="utf-8")

          manifest_path = Path("custom_components/energyiq/manifest.json")
          manifest = manifest_path.read_text(encoding="utf-8")
          if '"version": "3.0.4"' not in manifest:
              raise SystemExit("Expected manifest version 3.0.4 not found")
          manifest_path.write_text(manifest.replace('"version": "3.0.4"', '"version": "3.0.5"', 1), encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check custom_components/energyiq/www/energyiq-panel.js
          python -m compileall -q custom_components/energyiq tests

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-train-selection.yml
          git add custom_components/energyiq/www/energyiq-panel.js custom_components/energyiq/__init__.py custom_components/energyiq/manifest.json .github/workflows/apply-train-selection.yml
          git diff --cached --check
          git commit -m "Add Train selection column"
          git push origin HEAD:main
