name: Item 1 patch
on:
  push:
    branches:
      - changes/v3.1.52-item1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: changes/v3.1.52-item1
      - name: Patch layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/energyiq/www/energyiq-panel.js')
          s = p.read_text()
          old = '.shell{padding:18px 20px;max-width:1600px;margin:auto}'
          new = '.shell{padding:18px 20px;max-width:1600px;margin:auto;min-height:calc(100vh - 20px);box-sizing:border-box;display:flex;flex-direction:column}'
          assert old in s, 'shell CSS anchor not found'
          s = s.replace(old, new, 1)
          old = '.table-scroll{overflow:auto;max-height:calc(100vh - 330px);border:1px solid var(--divider-color);border-radius:10px}'
          new = '.table-scroll{overflow:auto;flex:1 1 auto;min-height:0;border:1px solid var(--divider-color);border-radius:10px}'
          assert old in s, 'table CSS anchor not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/energyiq/www/energyiq-panel.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Monitored Loads viewport height'
          git push
