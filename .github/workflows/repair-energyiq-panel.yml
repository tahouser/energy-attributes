name: Repair EnergyIQ panel identity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Repair EnergyIQ panel identity')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply frontend identity fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("custom_components/energyiq/www/energyiq-panel.js")
          text = p.read_text()
          old_tag = 'const TAG = "energyiq-panel";'
          new_tag = 'const TAG = "energyiq-panel-v301";'
          old_version = 'const VERSION = "3.0.0";'
          new_version = 'const VERSION = "3.0.1";'
          if old_tag not in text:
              raise SystemExit("Expected EnergyIQ panel tag was not found")
          if old_version not in text:
              raise SystemExit("Expected EnergyIQ panel version was not found")
          text = text.replace(old_tag, new_tag, 1).replace(old_version, new_version, 1)
          p.write_text(text)
          PY
          node --check custom_components/energyiq/www/energyiq-panel.js

      - name: Commit repaired panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/energyiq/www/energyiq-panel.js
          git diff --cached --quiet && exit 0
          git commit -m "Repair EnergyIQ panel identity [skip ci]"
          git push
